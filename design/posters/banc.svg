<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4f7a"/>
      <stop offset="0.3" stop-color="#5a86a8"/>
      <stop offset="0.48" stop-color="#d9a3a0"/>
      <stop offset="0.56" stop-color="#f8c3a0"/>
      <stop offset="0.6" stop-color="#ffe0b0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="620" cy="560" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="1"/>
      <stop offset="0.15" stop-color="#ffd9a0" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffb08a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffb08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8cf"/>
      <stop offset="0.25" stop-color="#4fb8bb"/>
      <stop offset="0.6" stop-color="#2496a6"/>
      <stop offset="1" stop-color="#156f86"/>
    </linearGradient>
    <linearGradient id="shallow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfeadc"/>
      <stop offset="1" stop-color="#7fd2c4"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dcae"/>
      <stop offset="1" stop-color="#e9bf82"/>
    </linearGradient>
    <linearGradient id="duneLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9c47a"/>
      <stop offset="0.6" stop-color="#eaa25c"/>
      <stop offset="1" stop-color="#d98a4c"/>
    </linearGradient>
    <linearGradient id="duneShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8653f"/>
      <stop offset="1" stop-color="#d07f4c"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9fb0"/>
      <stop offset="1" stop-color="#f06f8c"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff2c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#06202c" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
    </filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="6"/></filter><filter id="blur10"><feGaussianBlur stdDeviation="14"/></filter>

    <!-- flying flamingo, facing right, wings up -->
    <symbol id="flyUp" viewBox="0 0 200 70" overflow="visible">
      <path d="M8,44 L84,40 L84,42 L8,47 Z" fill="#e8607c"/>
      <path d="M2,44 L10,41 L10,48 Z" fill="#e8607c"/>
      <ellipse cx="100" cy="40" rx="22" ry="8" fill="url(#pink)"/>
      <path d="M118,37 C140,34 160,33 178,34 L178,38 C160,37 140,39 118,43 Z" fill="#f78ba0"/>
      <ellipse cx="183" cy="35" rx="7" ry="4.5" fill="#f78ba0"/>
      <path d="M188,33 L198,36 L192,42 L188,38 Z" fill="#1d1d24"/>
      <path d="M92,36 C88,20 82,8 70,0 C86,6 102,18 112,36 Z" fill="#ff9fb0"/>
      <path d="M70,0 C78,6 84,12 88,20 L80,14 Z" fill="#1d1d24"/>
      <path d="M104,36 C104,24 106,14 112,4 C114,16 114,26 112,38 Z" fill="#f07a92"/>
      <path d="M112,4 C113,10 113,16 112,22 L109,14 Z" fill="#1d1d24"/>
    </symbol>
    <!-- flying flamingo, wings down -->
    <symbol id="flyDown" viewBox="0 0 200 70" overflow="visible">
      <path d="M8,34 L84,32 L84,34 L8,37 Z" fill="#e8607c"/>
      <path d="M2,34 L10,31 L10,38 Z" fill="#e8607c"/>
      <ellipse cx="100" cy="32" rx="22" ry="8" fill="url(#pink)"/>
      <path d="M118,29 C140,27 160,26 178,27 L178,31 C160,30 140,32 118,35 Z" fill="#f78ba0"/>
      <ellipse cx="183" cy="28" rx="7" ry="4.5" fill="#f78ba0"/>
      <path d="M188,26 L198,29 L192,35 L188,31 Z" fill="#1d1d24"/>
      <path d="M92,36 C86,50 78,60 64,68 C82,64 100,52 112,36 Z" fill="#ff9fb0"/>
      <path d="M64,68 C72,64 80,58 86,50 L76,58 Z" fill="#1d1d24"/>
      <path d="M104,36 C106,48 110,56 118,64 C118,52 116,44 112,36 Z" fill="#f07a92"/>
    </symbol>
    <!-- standing flamingo -->
    <symbol id="stand" viewBox="0 0 70 170" overflow="visible">
      <path d="M30,78 L31,168 L33,168 L33,78 Z" fill="#e8607c"/>
      <path d="M38,78 L40,118 L28,124 L28,126 L42,120 L40,78 Z" fill="#e8607c"/>
      <ellipse cx="34" cy="68" rx="24" ry="14" transform="rotate(-12 34 68)" fill="url(#pink)"/>
      <path d="M10,72 L2,78 L14,76 Z" fill="#c94a68"/>
      <path d="M50,62 C60,52 58,40 48,32 C40,24 40,12 50,6 L54,10 C46,16 46,24 54,30 C66,40 66,56 54,66 Z" fill="#f78ba0"/>
      <ellipse cx="54" cy="7" rx="8" ry="5" fill="#f78ba0"/>
      <path d="M60,4 L68,10 L62,16 L58,10 Z" fill="#1d1d24"/>
      <path d="M14,64 C22,58 36,58 46,64 C36,66 24,68 14,64 Z" fill="#ffb7c3" opacity="0.7"/>
    </symbol>
    <!-- Imraguen lanche with lateen sail -->
    <symbol id="lanche" viewBox="0 0 120 120" overflow="visible">
      <path d="M8,100 C30,110 90,110 112,98 L106,92 L14,92 Z"/>
      <path d="M58,92 L60,10 L62,10 L62,92 Z"/>
      <path d="M60,8 L110,86 L22,88 Z"/>
    </symbol>
    <symbol id="gull" viewBox="0 0 40 16" overflow="visible">
      <path d="M0,10 C8,2 14,2 20,9 C26,2 32,2 40,10 C32,6 26,7 20,13 C14,7 8,6 0,10 Z"/>
    </symbol>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- soft clouds -->
  <g fill="#ffe3d0" opacity="0.35" filter="url(#blur2)">
    <ellipse cx="1350" cy="300" rx="260" ry="18"/><ellipse cx="1480" cy="330" rx="200" ry="12"/>
    <ellipse cx="300" cy="250" rx="220" ry="14"/><ellipse cx="1700" cy="420" rx="180" ry="10"/>
  </g>
  <rect width="1920" height="700" fill="url(#sunGlow)"/>
  <circle cx="620" cy="566" r="62" fill="#fff6dc"/>

  <!-- sea -->
  <rect y="600" width="1920" height="480" fill="url(#sea)"/>
  <!-- sun path on water -->
  <g fill="#fff2c8">
    <rect x="560" y="610" width="120" height="3" opacity="0.9"/><rect x="540" y="626" width="160" height="3" opacity="0.8"/>
    <rect x="575" y="644" width="100" height="4" opacity="0.75"/><rect x="520" y="664" width="190" height="4" opacity="0.6"/>
    <rect x="560" y="690" width="130" height="4" opacity="0.5"/><rect x="510" y="720" width="220" height="5" opacity="0.4"/>
    <rect x="550" y="756" width="160" height="5" opacity="0.3"/><rect x="500" y="800" width="250" height="6" opacity="0.22"/>
  </g>
  <!-- sandbanks in the shallows -->
  <ellipse cx="1300" cy="640" rx="440" ry="20" fill="url(#shallow)" opacity="0.85" filter="url(#blur10)"/>
  <ellipse cx="1320" cy="638" rx="300" ry="8" fill="url(#sand)"/>
  <ellipse cx="1600" cy="760" rx="420" ry="40" fill="url(#shallow)" opacity="0.8" filter="url(#blur10)"/>
  <ellipse cx="1620" cy="756" rx="260" ry="16" fill="url(#sand)"/>
  <ellipse cx="1400" cy="1000" rx="900" ry="110" fill="url(#shallow)" opacity="0.5" filter="url(#blur10)"/>

  <!-- lanches on the horizon with reflections -->
  <g fill="#3a3550">
    <use href="#lanche" x="1060" y="560" width="58" height="58"/>
    <use href="#lanche" x="1150" y="566" width="48" height="48"/>
    <use href="#lanche" x="1230" y="562" width="54" height="54"/>
    <use href="#lanche" x="1480" y="572" width="40" height="40"/>
  </g>
  <g fill="#3a3550" opacity="0.18" transform="translate(0,1232) scale(1,-1)">
    <use href="#lanche" x="1060" y="604" width="58" height="58"/>
    <use href="#lanche" x="1150" y="604" width="48" height="48"/>
    <use href="#lanche" x="1230" y="604" width="54" height="54"/>
  </g>

  <!-- the great dune falling into the ocean -->
  <path d="M0,420 C160,400 330,430 470,500 C560,546 640,600 700,650 L0,680 Z" fill="#d48a52" opacity="0.8"/>
  <path d="M0,330 C120,330 260,360 380,420 C500,480 600,560 720,640 L760,660 L0,700 Z" fill="url(#duneLit)"/>
  <path d="M0,330 C120,330 260,360 380,420 C300,470 240,540 200,690 L0,700 Z" fill="url(#duneShade)" opacity="0.65"/>
  <path d="M0,700 L760,660 C820,690 840,720 760,740 L0,760 Z" fill="url(#sand)"/>
  <path d="M0,760 L760,740 C700,760 600,770 0,790 Z" fill="#cfe9df" opacity="0.8"/>
  <g fill="none" stroke="#fff1d6" stroke-opacity="0.45" stroke-width="2">
    <path d="M440,470 C520,520 600,580 680,630"/><path d="M380,500 C460,550 540,610 620,650"/><path d="M330,540 C410,580 500,630 560,662"/><path d="M500,460 C560,500 620,540 700,600"/>
  </g>

  <!-- standing flamingos in the foreground shallows, with reflections -->
  <g opacity="0.25" transform="translate(0,1916) scale(1,-1)"><use href="#stand" x="1690" y="798" width="66" height="160" transform="translate(3445,0) scale(-1,1)"/></g>
  <ellipse cx="1720" cy="958" rx="40" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1690" y="798" width="66" height="160" transform="translate(3445,0) scale(-1,1)"/>
  <g opacity="0.25" transform="translate(0,1920) scale(1,-1)"><use href="#stand" x="1300" y="790" width="70" height="170" transform="translate(2670,0) scale(-1,1)"/></g>
  <ellipse cx="1332" cy="960" rx="42" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1300" y="790" width="70" height="170" transform="translate(2670,0) scale(-1,1)"/>
  <g opacity="0.25" transform="translate(0,1930) scale(1,-1)"><use href="#stand" x="1500" y="800" width="68" height="165"/></g>
  <ellipse cx="1531" cy="965" rx="41" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1500" y="800" width="68" height="165"/>
  <g opacity="0.25" transform="translate(0,1944) scale(1,-1)"><use href="#stand" x="1860" y="797" width="72" height="175" transform="translate(3792,0) scale(-1,1)"/></g>
  <ellipse cx="1892" cy="972" rx="43" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1860" y="797" width="72" height="175" transform="translate(3792,0) scale(-1,1)"/>
  <g opacity="0.25" transform="translate(0,1980) scale(1,-1)"><use href="#stand" x="1170" y="790" width="82" height="200"/></g>
  <ellipse cx="1207" cy="990" rx="49" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1170" y="790" width="82" height="200"/>
  <g opacity="0.25" transform="translate(0,2000) scale(1,-1)"><use href="#stand" x="1350" y="785" width="89" height="215" transform="translate(2788,0) scale(-1,1)"/></g>
  <ellipse cx="1390" cy="1000" rx="53" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1350" y="785" width="89" height="215" transform="translate(2788,0) scale(-1,1)"/>
  <g opacity="0.25" transform="translate(0,2000) scale(1,-1)"><use href="#stand" x="1720" y="800" width="82" height="200" transform="translate(3522,0) scale(-1,1)"/></g>
  <ellipse cx="1757" cy="1000" rx="49" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1720" y="800" width="82" height="200" transform="translate(3522,0) scale(-1,1)"/>
  <g opacity="0.25" transform="translate(0,2010) scale(1,-1)"><use href="#stand" x="1540" y="800" width="84" height="205"/></g>
  <ellipse cx="1578" cy="1005" rx="51" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1540" y="800" width="84" height="205"/>
  <g opacity="0.25" transform="translate(0,2020) scale(1,-1)"><use href="#stand" x="1080" y="780" width="95" height="230" transform="translate(2254,0) scale(-1,1)"/></g>
  <ellipse cx="1123" cy="1010" rx="57" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1080" y="780" width="95" height="230" transform="translate(2254,0) scale(-1,1)"/>
  <g opacity="0.25" transform="translate(0,2060) scale(1,-1)"><use href="#stand" x="1250" y="780" width="103" height="250"/></g>
  <ellipse cx="1296" cy="1030" rx="62" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1250" y="780" width="103" height="250"/>
  <g opacity="0.25" transform="translate(0,2070) scale(1,-1)"><use href="#stand" x="1800" y="800" width="97" height="235" transform="translate(3696,0) scale(-1,1)"/></g>
  <ellipse cx="1844" cy="1035" rx="58" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1800" y="800" width="97" height="235" transform="translate(3696,0) scale(-1,1)"/>
  <g opacity="0.25" transform="translate(0,2080) scale(1,-1)"><use href="#stand" x="1630" y="800" width="99" height="240" transform="translate(3358,0) scale(-1,1)"/></g>
  <ellipse cx="1674" cy="1040" rx="59" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1630" y="800" width="99" height="240" transform="translate(3358,0) scale(-1,1)"/>
  <g opacity="0.25" transform="translate(0,2090) scale(1,-1)"><use href="#stand" x="1440" y="785" width="107" height="260"/></g>
  <ellipse cx="1488" cy="1045" rx="64" ry="5" fill="none" stroke="#e8fbf5" stroke-opacity="0.55" stroke-width="2"/>
  <use href="#stand" x="1440" y="785" width="107" height="260"/>

  <!-- flamingo flock in flight across the sky -->
  <g>
    <use href="#flyUp" x="760" y="250" width="180" height="63"/>
    <use href="#flyDown" x="900" y="300" width="170" height="60"/>
    <use href="#flyUp" x="1040" y="232" width="160" height="56"/>
    <use href="#flyDown" x="1170" y="284" width="150" height="52"/>
    <use href="#flyUp" x="1300" y="220" width="140" height="49"/>
    <use href="#flyDown" x="1420" y="266" width="130" height="46"/>
    <use href="#flyUp" x="1530" y="206" width="120" height="42"/>
    <use href="#flyDown" x="1630" y="248" width="110" height="38"/>
    <use href="#flyUp" x="1720" y="196" width="100" height="35"/>
    <use href="#flyDown" x="840" y="372" width="150" height="52"/>
    <use href="#flyUp" x="980" y="390" width="140" height="49"/>
    <use href="#flyDown" x="1110" y="360" width="130" height="46"/>
    <use href="#flyUp" x="1240" y="380" width="120" height="42"/>
    <use href="#flyDown" x="1360" y="350" width="110" height="38"/>
    <use href="#flyUp" x="1470" y="366" width="100" height="35"/>
    <use href="#flyDown" x="1570" y="334" width="90" height="32"/>
  </g>
  <!-- gulls -->
  <g fill="#2f3a4f" opacity="0.6">
    <use href="#gull" x="300" y="160" width="30" height="12"/><use href="#gull" x="350" y="190" width="22" height="9"/>
    <use href="#gull" x="420" y="150" width="26" height="10"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" filter="url(#grain)"/>
</svg>
